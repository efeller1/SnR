[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "structural-framework"
version = "0.2.0"
description = "Scored, dashboard-driven framework for investing alongside structural economic trends"
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.1",
  "numpy>=1.26",
  "pyarrow>=14",
  "pydantic>=2.5",
  "pyyaml>=6",
  "requests>=2.31",
  "tabulate>=0.9",
  "xlrd>=2.0",
]

[project.optional-dependencies]
prices = ["yfinance>=0.2.40"]
dashboard = ["streamlit>=1.30", "yfinance>=0.2.40"]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
